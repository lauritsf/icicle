<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 120 94" width="120" height="94">
  <title>ICICLE mark</title>
  <!-- Bare mark for compact contexts (favicon, avatar). Same language as logo.svg:
       rung-banded icicles, dashed ghost = predicted continuation, droplet = thaw. -->
  <defs>
    <g id="rungs">
      <rect x="0" y="39" width="120" height="12" fill="#c2ebff"/>
      <rect x="0" y="51" width="120" height="12" fill="#7fd0f7"/>
      <rect x="0" y="63" width="120" height="24" fill="#3faee8"/>
      <rect x="0" y="87" width="120" height="48" fill="#1487c8"/>
    </g>
    <clipPath id="m1"><path d="M11.8,39 Q15.8,65.7 18.4,85 Q20.2,67.5 24.2,39 Z"/></clipPath>
    <clipPath id="m2"><path d="M31,39 Q35.5,76.8 37.7,101 Q40.4,75 45,39 Z"/></clipPath>
    <clipPath id="m3"><path d="M53.5,39 Q57.2,53.2 59.2,63 Q60.9,53.6 64.5,39 Z"/></clipPath>
    <clipPath id="m4"><path d="M73,39 Q76.9,62.2 79.4,79 Q81.1,64.1 85,39 Z"/></clipPath>
    <clipPath id="m5"><path d="M93.4,39 Q97.5,71.4 99.6,93 Q101.9,70 106.6,39 Z"/></clipPath>
  </defs>
  <rect x="8" y="30" width="104" height="9" rx="4.5" fill="#0d5f96"/>
  <g clip-path="url(#m1)"><use href="#rungs"/></g>
  <g clip-path="url(#m2)"><use href="#rungs"/></g>
  <path d="M53.5,39 Q57.2,79.1 58.8,107 Q60.9,80.8 64.5,39 Z" fill="rgba(63,174,232,0.13)" stroke="#3faee8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <g clip-path="url(#m3)"><use href="#rungs"/></g>
  <g clip-path="url(#m4)"><use href="#rungs"/></g>
  <g clip-path="url(#m5)"><use href="#rungs"/></g>
  <circle cx="59" cy="113.5" r="2.6" fill="#3faee8"/>
</svg>
