    <clipPath id="i4"><path d="M73,53 Q76.9,71.6 79.4,85 Q81.1,73.1 85,53 Z"/></clipPath>
    <clipPath id="i5"><path d="M93.4,53 Q97.5,78.8 99.6,96 Q101.9,77.7 106.6,53 Z"/></clipPath>
